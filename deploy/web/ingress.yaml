apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vanyline
  namespace: media-station
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket support — required for the chat WS endpoint
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
  - host: vanyline.kydah.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vanyline
            port:
              number: 80
  tls:
  - hosts:
    - vanyline.kydah.fr
    secretName: vanyline-tls
