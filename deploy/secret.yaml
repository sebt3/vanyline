apiVersion: v1
kind: Secret
metadata:
  name: vanyline-secrets
  namespace: media-station
type: Opaque
stringData:
  # Generate with: openssl rand -base64 64 | tr -d '\n'
  COOKIE_SECRET: "CHANGE_ME"
  # The admin API bearer token — choose a long random string
  ADMIN_SECRET: "CHANGE_ME"
  # postgres://user:password@host:5432/dbname
  DATABASE_URL: "CHANGE_ME"
