# Déploiement de test de vanyline-sandbox — remplace les pods d'expérimentation
# deploy/sandbox-imagevol-*.yaml, depuis supprimés ; la recette image-volumes
# a été validée le 2026-07-01 sur ce même cluster, K8s 1.36.2 / cri-o 1.36.1,
# amd64.
#
#   kubectl apply --dry-run=client -f deploy/sandbox/sandbox-test.yaml   # validation schéma
#   kubectl apply -f deploy/sandbox/sandbox-test.yaml                    # déploiement réel
#   kubectl -n media-station port-forward svc/vanyline-sandbox-test 3000:3000
#
# Authentification (specs du 2026-10-04) : la sandbox n'accepte QUE le jeton du ServiceAccount de
# son Owner. Pour ce pod de test l'« Owner » est le SA `default` de media-station
# (VNL_OWNER_SUBJECT ci-dessous) ; obtenir un jeton d'accès :
#   kubectl -n media-station create token default --audience vanyline-sandbox --duration 10m
# puis `Authorization: Bearer <jeton>` sur le port 3000. Aucun mode sans authentification n'existe.
# /health et /metrics sont sur le port d'exploitation 9090 (non publié, sondes kubelet).
#   kubectl -n media-station logs -f deploy/vanyline-sandbox-test  (ou pod/...)
#   kubectl -n media-station delete -f deploy/sandbox/sandbox-test.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vanyline-sandbox-test-workspace
  namespace: media-station
  labels:
    app: vanyline
    role: sandbox-test
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: vanyline-sandbox-test
  namespace: media-station
  labels:
    app: vanyline
    role: sandbox-test
spec:
  restartPolicy: Always
  containers:
    - name: sandbox
      image: ghcr.io/sebt3/vanyline-sandbox:0.1.0
      ports:
        - name: mcp
          containerPort: 3000
        # Port d'exploitation (/health, /metrics) : délibérément absent du Service ci-dessous
        # (cf. sandbox/src/config.sdd, `ops_listen`).
        - name: ops
          containerPort: 9090
      env:
        - name: VNL_OWNER_SUBJECT
          value: "system:serviceaccount:media-station:default"
        - name: VNL_TOKEN_ISSUER
          value: "https://kubernetes.default.svc.cluster.local"
        - name: VNL_SANDBOX_ROOT
          value: "/workspace"
        # Toolchains via image volumes — PATH augmenté (pas remplacé),
        # LD_LIBRARY_PATH requis (le loader du base ne trouve pas les libs
        # du volume sinon, ex: libatomic.so.1 pour node).
        - name: PATH
          value: "/toolchains/rust/usr/local/cargo/bin:/toolchains/rust/usr/bin:/toolchains/node/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        - name: LD_LIBRARY_PATH
          value: "/toolchains/rust/usr/lib/x86_64-linux-gnu:/toolchains/rust/usr/local/lib:/toolchains/node/usr/lib/x86_64-linux-gnu:/toolchains/node/usr/local/lib"
        - name: RUSTUP_HOME
          value: "/toolchains/rust/usr/local/rustup"
        - name: CARGO_HOME
          value: "/workspace/.cargo"   # writable — PAS sur le volume rust (read-only)
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: rust-toolchain
          mountPath: /toolchains/rust
        - name: node-toolchain
          mountPath: /toolchains/node
      readinessProbe:
        httpGet:
          path: /health
          port: ops
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /health
          port: ops
        initialDelaySeconds: 10
        periodSeconds: 30
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: vanyline-sandbox-test-workspace
    - name: rust-toolchain
      image:
        reference: docker.io/library/rust:slim-trixie
        pullPolicy: IfNotPresent
    - name: node-toolchain
      image:
        reference: docker.io/library/node:trixie-slim
        pullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: vanyline-sandbox-test
  namespace: media-station
  labels:
    app: vanyline
    role: sandbox-test
spec:
  selector:
    app: vanyline
    role: sandbox-test
  ports:
    - name: mcp
      port: 3000
      targetPort: 3000
