# Déploiement de vanyline-controller — feature controller-bootstrap.
#
# Prérequis (une fois) : les CRDs (fichier statique, régénéré via
# deploy/controller/generate-crds.sh à chaque changement de schéma) :
#   kubectl apply -f deploy/controller/crds.yaml
#
#   kubectl apply -f deploy/controller/controller.yaml
#   kubectl -n media-station logs -f deploy/vanyline-controller
#   kubectl -n media-station delete -f deploy/controller/controller.yaml
#
# Le controller watche les trois CRDs (Owner/Project/Sandbox) sur TOUT le
# cluster (Api::all dans owner.rs/project.rs/sandbox.rs) — d'où ClusterRole +
# ClusterRoleBinding plutôt que Role/RoleBinding namespacés, même si les CRDs
# elles-mêmes sont namespacées (une seule instance du controller pour tout le
# cluster).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vanyline-controller
  namespace: media-station
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vanyline-controller
rules:
  - apiGroups: ["vanyline.solidite.fr"]
    resources: ["owners", "projects", "sandboxes", "applications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["vanyline.solidite.fr"]
    resources: ["owners/status", "projects/status", "sandboxes/status", "applications/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["vanyline.solidite.fr"]
    resources: ["owners/finalizers", "projects/finalizers", "sandboxes/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "serviceaccounts", "pods", "services", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Role/RoleBinding namespacés du Deployment `app` de chaque Application (accès
  # de VnlK8sClient aux CRs owners/projects/sandboxes/applications de son propre
  # namespace) — pas d'escalade de privilèges : le controller possède déjà, via
  # les règles vanyline.solidite.fr ci-dessus, un sur-ensemble cluster-wide des
  # droits qu'il délègue ici en scope namespace.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vanyline-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vanyline-controller
subjects:
  - kind: ServiceAccount
    name: vanyline-controller
    namespace: media-station
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanyline-controller
  namespace: media-station
  labels:
    app: vanyline-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vanyline-controller
  template:
    metadata:
      labels:
        app: vanyline-controller
    spec:
      serviceAccountName: vanyline-controller
      containers:
        - name: controller
          image: ghcr.io/sebt3/vanyline-controller:v0.0.9-alpha.8
          imagePullPolicy: Always
          env:
            - name: SANDBOX_IMAGE_TAG
              value: "v0.0.9-alpha.8"
            - name: APP_IMAGE_TAG
              value: "v0.0.9-alpha.8"
            - name: RUST_LOG
              value: "info,vanyline_controller=debug"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
