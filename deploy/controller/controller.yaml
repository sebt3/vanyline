# Déploiement de vanyline-controller — feature controller-bootstrap.
#
# Prérequis (une fois) : les CRDs (fichier statique, régénéré via
# deploy/controller/generate-crds.sh à chaque changement de schéma) :
#   kubectl apply -f deploy/controller/crds.yaml
#
#   kubectl apply -f deploy/controller/controller.yaml
#   kubectl -n media-station logs -f deploy/vanyline-controller
#   kubectl -n media-station delete -f deploy/controller/controller.yaml
#
# État cible (specs du 2026-10-04) : un Owner = un namespace (`<app-ns>-<owner>`), créé par le
# controller ; les droits de l'app dans ce namespace passent par un RoleBinding vers le
# ClusterRole `vanyline-app-owner-scope` (défini plus bas) ; Restate est un StatefulSet
# sous-ressource de l'Application. Le fichier crds.yaml est GÉNÉRÉ depuis le code : il doit être
# régénéré (generate-crds.sh) après le retrait de `existingPvc` (Owner et Project) et l'ajout de
# `spec.restate` / `status.namespace`.
#
# Le controller watche les quatre CRDs (Owner/Project/Sandbox/Application) sur TOUT le
# cluster (Api::all dans owner.rs/project.rs/sandbox.rs) — d'où ClusterRole +
# ClusterRoleBinding plutôt que Role/RoleBinding namespacés, même si les CRDs
# elles-mêmes sont namespacées (une seule instance du controller pour tout le
# cluster).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vanyline-controller
  namespace: media-station
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vanyline-controller
rules:
  - apiGroups: ["vanyline.solidite.fr"]
    resources: ["owners", "projects", "sandboxes", "applications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["vanyline.solidite.fr"]
    resources: ["owners/status", "projects/status", "sandboxes/status", "applications/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["vanyline.solidite.fr"]
    resources: ["owners/finalizers", "projects/finalizers", "sandboxes/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "serviceaccounts", "pods", "services", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Namespaces d'Owner (un Owner = un namespace, controller/src/namespace.sdd) : création, labels de
  # propriété, suppression par finalizer. Le controller ne supprime jamais un namespace qui ne porte
  # pas les labels de l'Owner (garde applicative).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Moteur de workflow : StatefulSet Restate, sous-ressource de l'Application.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Role/RoleBinding namespacés : Role de l'app dans le namespace d'application (owners,
  # applications) et RoleBinding `vanyline-app` dans chaque namespace d'Owner. Pas d'escalade de
  # privilèges : pour les Roles de l'app il possède déjà un sur-ensemble des droits délégués ;
  # le ClusterRole `vanyline-app-owner-scope` (qui porte serviceaccounts/token) est lié par le
  # seul verbe `bind` (resourceNames) — le controller ne détient PAS serviceaccounts/token lui-même
  # (sinon : jetons forgeables pour n'importe quel SA du cluster, kube-system compris).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["vanyline-app-owner-scope"]
    verbs: ["bind"]
---
# Droits délégués à l'app DANS le namespace d'un Owner (jamais cluster-wide) : le controller crée
# dans chaque namespace d'Owner un RoleBinding `vanyline-app` vers ce ClusterRole
# (controller/src/namespace.sdd). L'app ne peut ainsi demander des jetons que pour les SA de SES
# Owners, et ne voit que les projets/sandboxes de ses Owners.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vanyline-app-owner-scope
rules:
  - apiGroups: ["vanyline.solidite.fr"]
    resources: ["projects", "sandboxes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  # Jeton d'authentification de l'Owner auprès de sa sandbox (audience `vanyline-sandbox`).
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vanyline-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vanyline-controller
subjects:
  - kind: ServiceAccount
    name: vanyline-controller
    namespace: media-station
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanyline-controller
  namespace: media-station
  labels:
    app: vanyline-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vanyline-controller
  template:
    metadata:
      labels:
        app: vanyline-controller
    spec:
      serviceAccountName: vanyline-controller
      containers:
        - name: controller
          image: ghcr.io/sebt3/vanyline-controller:v0.0.11-alpha.11
          imagePullPolicy: Always
          env:
            - name: SANDBOX_IMAGE_TAG
              value: "v0.0.11-alpha.11"
            - name: APP_IMAGE_TAG
              value: "v0.0.11-alpha.11"
            # Optionnels (specs du 2026-10-04), à activer à l'implémentation correspondante :
            # - SA_ISSUER : surcharge de l'`iss` des jetons de SA ; par défaut le controller le
            #   découvre via /.well-known/openid-configuration de l'apiserver.
            # - VNL_OPS_ALLOWED_NAMESPACES : restreint la NetworkPolicy du port d'exploitation
            #   (`/health`, `/metrics`) de la sandbox à ces namespaces (virgules) ; absent = tout le cluster.
            # - RESTATE_IMAGE : image du StatefulSet Restate d'une Application qui porte `spec.restate`.
            #- name: SA_ISSUER
            #  value: "https://kubernetes.default.svc.cluster.local"
            #- name: VNL_OPS_ALLOWED_NAMESPACES
            #  value: "monitoring"
            #- name: RESTATE_IMAGE
            #  value: "docker.restate.dev/restatedev/restate:latest"
            - name: RUST_LOG
              value: "info,vanyline_controller=debug"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
