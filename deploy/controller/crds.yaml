                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              detectedAt:
                description: |-
                  Horodatage du dernier `detect` réussi. Même raison `skip_serializing_if`
                  que `languages`.
                format: date-time
                nullable: true
                type: string
              languages:
                description: |-
                  Langages détectés. Valeurs possibles : "rust", "js-ts", "vue",
                  "python", "dockerfile" (marqueur `dockerfile` : noms
                  Dockerfile/Containerfile/variants dans l'arbre HEAD). Ordre fixe
                  `["rust", "js-ts", "vue", "python", "dockerfile"]` filtré — cf.
                  `vanyline_sandbox::maint::detect_languages`. Écrit uniquement par le
                  Job `detect` (tâche 03) via un patch dédié — jamais par
                  `compute_status`. `skip_serializing_if` : voir note "Point
                  d'attention" dans le fichier de tâche — indispensable pour que le
                  merge patch de routine du reconciler Project n'écrase pas cette
                  valeur.
                items:
                  type: string
                type: array
              lastFetch:
                description: Horodatage du dernier fetch réussi.
                format: date-time
                nullable: true
                type: string
              pvcName:
                description: Nom du PVC workspace (toujours celui créé par le controller).
                nullable: true
                type: string
              worktrees:
                default: []
                description: Worktree présents dans le workspace. Absent => vec vide.
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        title: Project
        type: object
    served: true
    storage: true
    subresources:
      status: {}
