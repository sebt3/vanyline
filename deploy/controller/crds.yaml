apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: owners.vanyline.solidite.fr
spec:
  group: vanyline.solidite.fr
  names:
    kind: Owner
    plural: owners
    singular: owner
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.serviceAccount
      name: SA
      type: string
    - jsonPath: .status.pvcName
      name: PVC
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for OwnerSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Spec de l'`Owner` (identité cluster d'un utilisateur) — entièrement
              optionnelle : un `spec: {}` est valide et produit le `OwnerSpec` par défaut.
              Les défauts métier (`"1Gi"`, modes d'accès) sont appliqués au reconcile,
              jamais ici.
            properties:
              applicationRef:
                description: |-
                  Nom de la CR Application dont l'Ingress sert de base aux sous-domaines
                  de sandbox (`{sandbox}.sandboxes.{application.host}`). None => la
                  Sandbox reste ClusterIP-only (comportement actuel, pas d'erreur).
                nullable: true
                type: string
              egress:
                default: []
                description: White-list egress du namespace de l'Owner. Absent => vec vide.
                items:
                  description: |-
                    Une règle d'une white-list egress. `cidr` et `pod_selector` sont
                    exclusifs (l'un ou l'autre, jamais les deux) ; `namespace_selector` est
                    optionnel et se combine avec `pod_selector`. Aucune validation de cette
                    exclusivité au niveau du type — portée par la construction de la
                    `NetworkPolicy` (tâche `netpol-builder`).
                  properties:
                    cidr:
                      description: |-
                        Bloc CIDR destinataire. Exclusif avec `pod_selector` (porté par le
                        netpol-builder, pas par ce type).
                      nullable: true
                      type: string
                    description:
                      description: Description humaine de la règle (non vide — NON vérifiée ici).
                      type: string
                    namespaceSelector:
                      description: Sélecteur de namespaces, combinable avec `pod_selector`.
                      nullable: true
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                          items:
                            description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector applies to.
                                type: string
                              operator:
                                description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                                items:
                                  type: string
                                type: array
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                    podSelector:
                      description: Pods destinataires. Exclusif avec `cidr`.
                      nullable: true
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                          items:
                            description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector applies to.
                                type: string
                              operator:
                                description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                                items:
                                  type: string
                                type: array
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                    ports:
                      default: []
                      description: |-
                        Ports autorisés. Absent => vec vide ; TCP-pour-`None` est une
                        interprétation du netpol-builder, pas une valeur posée ici.
                      items:
                        description: Port autorisé dans une [`EgressRule`].
                        properties:
                          port:
                            description: |-
                              Numéro de port ; aucune validation de contenu ici (c'est l'apiserver
                              qui rejette un hors-plage à l'usage).
                            format: int32
                            type: integer
                          protocol:
                            description: '"TCP" | "UDP". `None` => TCP (interprété par `netpol-builder`, pas ici).'
                            nullable: true
                            type: string
                        required:
                        - port
                        type: object
                      type: array
                  required:
                  - description
                  type: object
                type: array
              homeAccessMode:
                description: |-
                  Mode d'accès du PVC home. None => "`ReadWriteMany`" (défaut historique —
                  le home est partagé entre les sandboxes concurrentes d'un même Owner).
                  À ajuster (ex. "`ReadWriteOnce`") sur un cluster sans `StorageClass` RWX
                  (ex. single-node local-path) — aucun partage concurrent alors possible.
                nullable: true
                type: string
              homeSize:
                description: |-
                  Taille du PVC home. None => le défaut métier `"1Gi"` est appliqué au
                  reconcile, jamais ici.
                nullable: true
                type: string
              homeStorageClass:
                description: |-
                  `StorageClass` du PVC home. None => classe par défaut du cluster
                  (RWX recommandé, ex. `CephFS`).
                nullable: true
                type: string
              projectDefaults:
                description: Replis de stockage appliqués aux Projects futurs de cet Owner.
                nullable: true
                properties:
                  storageAccessMode:
                    description: |-
                      Défaut de repli pour `ProjectSpec.storage_access_mode` quand ce
                      dernier est absent. None => "`ReadWriteOnce`" (défaut historique).
                    nullable: true
                    type: string
                  storageClass:
                    description: '`StorageClass` de PVC workspace par défaut pour les Projects de l''Owner.'
                    nullable: true
                    type: string
                  storageSize:
                    description: Taille de PVC workspace par défaut pour les Projects de l'Owner.
                    nullable: true
                    type: string
                type: object
            type: object
          status:
            description: Status de l'Owner, posé par son reconciler.
            nullable: true
            properties:
              conditions:
                default: []
                description: Conditions K8s standard. Absent => vec vide.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              namespace:
                description: |-
                  Namespace de l'Owner (`{app_namespace}-{owner}`, calculé par
                  [`owner_namespace_name`]) — posé par le reconciler. UN OWNER = UN NAMESPACE
                  (décision 2026-10-04).
                nullable: true
                type: string
              pvcName:
                description: Nom du PVC home de l'Owner.
                nullable: true
                type: string
              serviceAccount:
                description: Nom du `ServiceAccount` de l'Owner.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: Owner
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
