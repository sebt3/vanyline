      openAPIV3Schema:
        description: Auto-generated derived type for ProjectSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Spec du `Project` (dépôt git d'un Owner) : seuls `owner` et `repoUrl` sont
              requis ; les replis (`caches`, `fetchInterval`, modes d'accès) vivent côté
              controller.
            properties:
              caches:
                description: Caches partagés. None => `["cargo", "pnpm", "pip"]`.
                items:
                  type: string
                nullable: true
                type: array
              defaultBranch:
                description: Branche par défaut du repo.
                nullable: true
                type: string
              egress:
                default: []
                description: White-list egress du namespace du projet. Absent => vec vide.
                items:
                  description: |-
                    Une règle d'une white-list egress. `cidr` et `pod_selector` sont
                    exclusifs (l'un ou l'autre, jamais les deux) ; `namespace_selector` est
                    optionnel et se combine avec `pod_selector`. Aucune validation de cette
                    exclusivité au niveau du type — portée par la construction de la
                    `NetworkPolicy` (tâche `netpol-builder`).
                  properties:
                    cidr:
                      description: |-
                        Bloc CIDR destinataire. Exclusif avec `pod_selector` (porté par le
                        netpol-builder, pas par ce type).
                      nullable: true
                      type: string
                    description:
                      description: Description humaine de la règle (non vide — NON vérifiée ici).
                      type: string
                    namespaceSelector:
                      description: Sélecteur de namespaces, combinable avec `pod_selector`.
                      nullable: true
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                          items:
                            description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector applies to.
                                type: string
                              operator:
                                description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                                items:
                                  type: string
                                type: array
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                    podSelector:
                      description: Pods destinataires. Exclusif avec `cidr`.
                      nullable: true
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                          items:
                            description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector applies to.
                                type: string
                              operator:
                                description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                                items:
                                  type: string
                                type: array
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                    ports:
                      default: []
                      description: |-
                        Ports autorisés. Absent => vec vide ; TCP-pour-`None` est une
                        interprétation du netpol-builder, pas une valeur posée ici.
                      items:
                        description: Port autorisé dans une [`EgressRule`].
                        properties:
                          port:
                            description: |-
                              Numéro de port ; aucune validation de contenu ici (c'est l'apiserver
                              qui rejette un hors-plage à l'usage).
                            format: int32
                            type: integer
                          protocol:
                            description: '"TCP" | "UDP". `None` => TCP (interprété par `netpol-builder`, pas ici).'
                            nullable: true
                            type: string
                        required:
                        - port
                        type: object
                      type: array
                  required:
                  - description
                  type: object
                type: array
              fetchInterval:
                description: Intervalle du `CronJob` de fetch. None => "1h".
                nullable: true
                type: string
              gitSecret:
                description: |-
                  DÉPRÉCIÉ — plus consommé par le controller depuis git-integration
                  (la clé SSH vit dans le PVC Owner, cf. docs/features/git-integration.md
                  section 0). Champ conservé pour la migration, pas supprimé.
                nullable: true
                type: string
              owner:
                description: Owner (utilisateur) auquel appartient le projet. REQUIS.
                type: string
              repoUrl:
                description: URL du dépôt git. REQUIS.
                type: string
              storageAccessMode:
                description: |-
                  Mode d'accès du PVC workspace. None => repli sur
                  `Owner.spec.project_defaults.storage_access_mode`, puis
                  "`ReadWriteOnce`" (défaut historique).
                nullable: true
                type: string
              storageClass:
                description: '`StorageClass` du PVC workspace. Repli : `Owner.spec.project_defaults`.'
                nullable: true
                type: string
              storageSize:
                description: |-
                  Taille du PVC workspace. Repli : `Owner.spec.project_defaults`, puis
                  défaut du controller.
                nullable: true
                type: string
            required:
            - owner
            - repoUrl
            type: object
          status:
            description: |-
              Status du Project. Les couples `skip_serializing_if` de
              `languages`/`detected_at` sont LE contrat anti-écrasement du merge-patch
              de routine (ils protègent les valeurs écrites par le Job `detect`).
            nullable: true
            properties:
              cloned:
                default: false
                description: |-
                  Le clone bare initial est en place. Sérialisé même à `false` :
                  `compute_status` est la seule source de ce champ.
                type: boolean
              conditions:
                default: []
                description: Conditions K8s standard. Absent => vec vide.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
