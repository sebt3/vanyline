[package]
name = "vanyline-sandbox"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Serveur embarqué dans le pod sandbox : MCP, git, santé du code, jobs et WebSocket éditeur ; embarque l'utilitaire vanyline-maint."
repository = "https://github.com/sebt3/vanyline"
readme = "../README.md"
keywords = ["kubernetes", "mcp", "sandbox"]
categories = ["web-programming", "asynchronous"]

[features]
# Expose `auth::test_support` (clés et jetons de test signés) aux tests
# d'intégration `sandbox/tests/`. Jamais activée dans le binaire de production
# — il n'existe aucun mode de contournement d'authentification (auth.sdd).
test = []

[[bin]]
name = "vanyline-sandbox"
path = "src/main.rs"

[[bin]]
name = "vanyline-maint"
path = "src/bin/maint.rs"

[[bin]]
name = "vnl-hadolint-lsp"
path = "src/bin/hadolint_lsp.rs"

[[bin]]
name = "vnl-ruff-lsp"
path = "src/bin/ruff_lsp.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
rand = "0.8"
axum = { version = "0.8", features = ["json", "macros", "ws"] }
portable-pty = "0.9"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.7", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
# `rust_crypto` : jsonwebtoken 11 ne fournit aucun CryptoProvider par défaut et
# panique au premier encode/decode sans lui (ambiguïté aws_lc_rs/ring déjà
# documentée pour rustls ci-dessous — jsonwebtoken n'en dépend pas). Le
# provider pur-Rust est le choix déterministe pour la vérification JWT
# (auth.sdd).
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
libc = "0.2"

# Observability — Prometheus
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# Observability — OpenTelemetry (optional, non-blocking)
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = { version = "0.33", default-features = false }

vanyline-tools = { path = "../tools" }
vanyline-crds = { path = "../crds" }
kube = { version = "4", default-features = false, features = ["client", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }

# rustls en dépendance régulière : le binaire vanyline-maint installe
# explicitement le CryptoProvider ring avant tout Client TLS (l'auto-détection
# échoue ici car rustls voit à la fois les features aws_lc_rs et ring selon les
# dépendances — axum-server/reqwest activent aws_lc_rs, kube active ring).
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
# Auto-dépendance avec feature : expose `auth::test_support` à `sandbox/tests/`
# (prescription de sandbox/src/auth.sdd, tâche « feature cargo test »).
vanyline-sandbox = { path = ".", features = ["test"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
[lints]
workspace = true
