[package]
name = "vanyline-health"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Santé du code : presets de vérifications par langage, parseurs (lcov, clippy, tsc, ruff, hadolint), exécution et rapport typé exporté en TypeScript."
repository = "https://github.com/sebt3/vanyline"
readme = "../README.md"
keywords = ["code-quality", "linting", "testing"]
categories = ["development-tools", "development-tools::testing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "fs", "time", "io-util"] }
tracing = "0.1"
ts-rs = { version = "12", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
ts-rs = ["dep:ts-rs"]

[lints]
workspace = true
