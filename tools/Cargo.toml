[package]
name = "vanyline-tools"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Outils MCP partagés : exécution de commandes, système de fichiers, recherche et rendu de sortie."
repository = "https://github.com/sebt3/vanyline"
readme = "../README.md"
keywords = ["mcp", "tools", "filesystem"]
categories = ["development-tools", "asynchronous"]

[dependencies]
tokio = { version = "1", features = ["full", "process"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
regex = "1"
globset = "0.4"
ignore = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
[lints]
workspace = true
