[package]
name = "vanyline-cfgstore"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Stockage de la configuration vanyline : store fichier asynchrone, domaine typé et couches de configuration."
repository = "https://github.com/sebt3/vanyline"
readme = "../README.md"
keywords = ["config", "storage", "configuration"]
categories = ["config", "asynchronous"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
yaml_serde = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[lints]
workspace = true
