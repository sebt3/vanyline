[package]
name = "vanyline-lib"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rig-core = { version = "0.38", features = ["rmcp"] }
rmcp = { version = "1.7.0", features = ["transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
percent-encoding = "1"
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
globset = "0.4"
vanyline-crds = { path = "../crds", optional = true }
kube = { version = "4", default-features = false, features = ["client", "rustls-tls"], optional = true }
k8s-openapi = { version = "0.28", features = ["latest", "schemars"], optional = true }

[features]
k8s = ["dep:kube", "dep:vanyline-crds", "dep:k8s-openapi"]

[dev-dependencies]
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-streamable-http-server", "client"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
schemars = "1.1.0"
anyhow = "1"
tokio-util = "0.7"
