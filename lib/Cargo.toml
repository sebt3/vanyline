[package]
name = "vanyline-lib"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Librairie d'interface avec le cluster Kubernetes et les sandboxes : client K8s (feature k8s), client de l'accès fichier de la sandbox."
repository = "https://github.com/sebt3/vanyline"
readme = "../README.md"
keywords = ["kubernetes", "sandbox", "client"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
futures = "0.3"
vanyline-crds = { path = "../crds", optional = true }
kube = { version = "4", default-features = false, features = ["client", "rustls-tls"], optional = true }
kube-runtime = { version = "4", default-features = false, optional = true }
k8s-openapi = { version = "0.28", features = ["latest", "schemars"], optional = true }
tokio-tungstenite = { version = "0.29", optional = true }
secrecy = { version = "0.10", optional = true }

[features]
k8s = ["dep:kube", "dep:kube-runtime", "dep:vanyline-crds", "dep:k8s-openapi", "dep:tokio-tungstenite", "dep:secrecy"]

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json", "query"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true
