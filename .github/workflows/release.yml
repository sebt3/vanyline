name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-cli:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - name: Build and upload vanyline
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: vanyline
          manifest-path: cli/Cargo.toml
          target: ${{ matrix.target }}
          archive: vanyline-$target
          tar: all
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  ext:
    name: Extension VS Code (.vsix)
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=vanyline
      - name: Package vsix
        working-directory: ext
        run: npx @vscode/vsce package --no-dependencies
      - name: Upload vsix to release
        run: gh release upload "$GITHUB_REF_NAME" ext/vanyline-*.vsix --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: app
            dockerfile: app/Dockerfile
          - component: sandbox
            dockerfile: sandbox/Dockerfile
          - component: controller
            dockerfile: controller/Dockerfile
          - component: toolchains-rust
            dockerfile: toolchains/rust/Dockerfile
          - component: toolchains-node
            dockerfile: toolchains/node/Dockerfile
    steps:
      - uses: actions/checkout@v7
#      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64   # ,linux/arm64    Disabling arm64 builds for now
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ github.ref_name }}