name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    name: Frontend + packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # packages partagés d'abord (frontend en dépend via alias source)
      - run: npm run check --workspace=@vanyline/protocol
      - run: npm run test --workspace=@vanyline/protocol
      - run: npm run check --workspace=@vanyline/ui
      - run: npm run test --workspace=@vanyline/ui
      - run: npm run build --workspace=frontend
      - run: npm run check --workspace=frontend
      - run: npm run test --workspace=frontend

  tsrs:
    name: ts-rs types up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # régénère packages/protocol/src/generated/ depuis vanyline-lib
      - run: cargo test -p vanyline-lib --features ts-rs
      - run: git diff --exit-code -- packages/protocol/src/generated/

  coverage:
    name: Coverage (baseline measurement, no gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --json --output-path coverage.json
          cargo llvm-cov report --summary-only > coverage-summary.txt
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: |
            coverage.json
            coverage-summary.txt