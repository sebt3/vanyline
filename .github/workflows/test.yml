name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  clippy-pedantic:
    name: Clippy pedantic/nursery (non-blocking, non-regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Count pedantic/nursery warnings
        env:
          CARGO_INCREMENTAL: "0"
        run: |-
          set -o pipefail;
          cargo clippy --workspace --all-targets --message-format=short -- -W clippy::pedantic -W clippy::nursery > pedantic-report.txt 2>&1 || true;
          TOTAL=$(grep -c ': warning: ' pedantic-report.txt);
          echo "pedantic/nursery warnings total: $TOTAL";
          if [ "$TOTAL" -lt 50 ]; then
            echo "::error::Total suspicieusement bas ($TOTAL) — le parsing a probablement casse (changement de format clippy ?), pas une vraie amelioration. Verifier pedantic-report.txt.";
            exit 1;
          fi;
          BASELINE=585;
          if [ "$TOTAL" -gt "$BASELINE" ]; then;
            echo "::warning::Regression: $TOTAL warnings pedantic/nursery > baseline $BASELINE (non bloquant, a corriger dans une future iteration)";
          fi
      - name: Upload pedantic report
        uses: actions/upload-artifact@v4
        with:
          name: clippy-pedantic-report
          path: pedantic-report.txt

  doc-lint:
    name: Documentation lint (missing_docs, non-regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Count missing_docs warnings
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -o pipefail
          COUNT=$(\
            cargo rustc -p vanyline-lib --lib -- -W missing_docs 2>&1 | grep -c 'warning: missing documentation'; \
            cargo rustc -p vanyline-sandbox --lib -- -W missing_docs 2>&1 | grep -c 'warning: missing documentation'; \
            cargo rustc -p vanyline-tools --lib -- -W missing_docs 2>&1 | grep -c 'warning: missing documentation'; \
            cargo rustc -p vanyline-crds --lib -- -W missing_docs 2>&1 | grep -c 'warning: missing documentation'; \
            cargo rustc -p vanyline-app --bin vanyline-app -- -W missing_docs 2>&1 | grep -c 'warning: missing documentation'; \
            cargo rustc -p vanyline-controller --bin vanyline-controller -- -W missing_docs 2>&1 | grep -c 'warning: missing documentation');
          TOTAL=0;
          for n in $COUNT; do TOTAL=$((TOTAL + n)); done;
          echo "missing_docs warnings total: $TOTAL";
          BASELINE=621;
          if [ "$TOTAL" -gt "$BASELINE" ]; then
            echo "::error::Regression: $TOTAL missing_docs warnings > baseline $BASELINE";
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=frontend
      - run: npm run check --workspace=frontend
      - run: npm run test --workspace=frontend

  coverage:
    name: Coverage (baseline measurement, no gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --json --output-path coverage.json
          cargo llvm-cov report --summary-only > coverage-summary.txt
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: |
            coverage.json
            coverage-summary.txt