version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "cargo"
  - package-ecosystem: "cargo"
    directory: "/app"
    schedule:
      interval: "weekly"
    labels:
      - "app"
  - package-ecosystem: "cargo"
    directory: "/cli"
    schedule:
      interval: "weekly"
    labels:
      - "cli"
  - package-ecosystem: "cargo"
    directory: "/controller"
    schedule:
      interval: "weekly"
    labels:
      - "controller"
  - package-ecosystem: "cargo"
    directory: "/crds"
    schedule:
      interval: "weekly"
    labels:
      - "crds"
  - package-ecosystem: "cargo"
    directory: "/lib"
    schedule:
      interval: "weekly"
    labels:
      - "lib"
  - package-ecosystem: "cargo"
    directory: "/sandbox"
    schedule:
      interval: "weekly"
    labels:
      - "sandbox"
  - package-ecosystem: "cargo"
    directory: "/tools"
    schedule:
      interval: "weekly"
    labels:
      - "tools"
  - package-ecosystem: "cargo"
    directory: "/cfgstore"
    schedule:
      interval: "weekly"
    labels:
      - "cfgstore"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "frontend"
  # Bases `FROM` des Dockerfiles (app/sandbox/controller + images toolchain).
  # Ne suit PAS les binaires téléchargés + checksum dans les RUN (hadolint,
  # ruff) — ceux-là restent bumpés à la main (une ligne + SHA256).
  - package-ecosystem: "docker"
    directories:
      - "/app"
      - "/sandbox"
      - "/controller"
      - "/toolchains/*"
    schedule:
      interval: "weekly"
    labels:
      - "docker"
