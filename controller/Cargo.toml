[package]
name = "vanyline-controller"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Opérateur Kubernetes du workspace vanyline : réconcilie les CRDs Owner, Project, Sandbox et Application."
repository = "https://github.com/sebt3/vanyline"
readme = "../README.md"
keywords = ["kubernetes", "operator", "controller"]
categories = ["api-bindings", "asynchronous"]

[[bin]]
name = "vanyline-controller"
path = "src/main.rs"

[dependencies]
kube = { version = "4", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
vanyline-crds = { path = "../crds" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
futures = "0.3"
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
# rustls en dev-dependency : les tests du controller construisent des Client
# TLS hors connexion ; l'auto-détection du CryptoProvider échoue car rustls
# voit à la fois les features aws_lc_rs et ring selon les dépendances
# (axum-server/reqwest activent aws_lc_rs, kube active ring) — même motif que
# la dépendance régulière de sandbox/Cargo.toml.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
[lints]
workspace = true
