[package]
name = "vanyline-crds"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Définitions des CRDs du controller vanyline (Owner, Project, Sandbox, Application) et nommage du namespace d'Owner."
repository = "https://github.com/sebt3/vanyline"
readme = "../README.md"
keywords = ["kubernetes", "crd", "operator"]
categories = ["api-bindings", "data-structures"]

[dependencies]
kube = { version = "4", default-features = false, features = ["derive"] }
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[lints]
workspace = true
