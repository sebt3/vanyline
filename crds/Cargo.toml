[package]
name = "vanyline-crds"
version = "0.0.1-alpha.1"
edition = "2021"

[dependencies]
kube = { version = "4", default-features = false, features = ["derive"] }
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"