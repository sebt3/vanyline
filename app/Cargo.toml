[package]
name = "vanyline-app"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vanyline-app"
path = "src/main.rs"

[dependencies]
vanyline-lib = { path = "../lib", features = ["k8s"] }
vanyline-crds = { path = "../crds" }
vanyline-tools = { path = "../tools" }
axum = { version = "0.8.8", features = ["ws", "macros"] }
openidconnect = "4.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sqlx = { version = "0.8", features = ["postgres", "uuid", "chrono", "json", "runtime-tokio-rustls", "migrate"] }
rig-core = { version = "0.38", features = ["rmcp"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs", "cors"] }
cookie = { version = "0.18", features = ["private"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
futures = "0.3"
base64 = "0.22"
url = "2"
parking_lot = "0.12"
