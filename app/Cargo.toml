[package]
name = "vanyline-app"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Backend de l'environnement : authentification OIDC, configuration LLM et agents, workflows Restate et relais sandbox."
repository = "https://github.com/sebt3/vanyline"
readme = "../README.md"
keywords = ["web", "oidc", "llm"]
categories = ["web-programming", "asynchronous"]

[[bin]]
name = "vanyline-app"
path = "src/main.rs"

[dependencies]
vanyline-lib = { path = "../lib", features = ["k8s"] }
vanyline-crds = { path = "../crds" }
axum = { version = "0.8.8", features = ["ws", "macros"] }
openidconnect = "4.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rig-core = { version = "0.38", features = ["rmcp"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.7", features = ["fs", "cors"] }
cookie = { version = "0.18", features = ["private"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
futures = "0.3"
base64 = "0.22"
url = "2"
parking_lot = "0.12"
bytes = "1"
percent-encoding = "2"
miryad-core = { version = "0.4.0", default-features = false, features = [
    "swagger-ui",
    "workflow",
    "mcp",
    "lymaille",
    "matrix",
] }
# `app/src/sessions/host.sdd` — @ToolsetContext construit par @VnlLymailleHost::resolve_context
# (lymaille 0.3, version déclarée par miryad-core 0.4.0 : le graphe résolu est
# le même, une seule et même identité du type dans le trait) et @Zeroizing du jeton MCP
# (`McpGrant.token`). Aucune dépendance nouvelle au graphe : les deux crates venaient déjà
# via miryad-core.
lymaille = "0.3"
zeroize = "1"
# W3 `app/src/workflow/runtime.rs` (runtime.sdd, Platform `restate-sdk`) : liaison des services
# `DagInterpreter`/`StepDispatcher` à l'`Endpoint` et serveur HTTP/2 interne. Version identique à
# celle déclarée par miryad-core 0.4.0 (`"0.12"`, résolu 0.12.1 dans `Cargo.lock`) et feature
# `http_server` identique. Contrairement à miryad-core (dépendance optionnelle, montée par son
# feature `workflow`, SANS `default-features = false`), le `default-features = false` ci-dessous
# est propre à l'app : harnais de l'app (aucune feature par défaut importée sans décision) ;
# graphe résolu inchangé (validation W3).
restate-sdk = { version = "0.12", default-features = false, features = ["http_server"] }
utoipa = "5"
sea-orm = { version = "2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "mock"] }
sea-orm-migration = { version = "2", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
# W2 `app/src/workflow/steps/` : `rhai.sdd` enregistre des fonctions sur le moteur Rhai de
# `RhaiStep` (types `Engine`/`Dynamic`/`Map`) ; `gate.sdd` (`Platform: …/vanyline-health`)
# évalue le rapport via `HealthReport::status` et `CoverageTotals::percent` sans le
# réinterpréter. (`handlebars` retiré en C1, chantier lymaille : seul `agent.sdd` le
# consommait ; le gabarit `task` du step `subagent` est rendu par miryad-core.)
rhai = "1.26"
vanyline-health = { path = "../health" }
# B8 `app/src/sessions/events.rs` (events.sdd, Depends on) : export TypeScript de @HostEvent vers
# `packages/protocol/src/generated/`. Version et features IDENTIQUES à `lib/Cargo.toml` (résolu
# 12.0.1 dans `Cargo.lock`, `serde-json-impl` pour le mapping `serde_json::Value` → `any`) :
# aucune dépendance nouvelle au graphe résolu, une seule identité de la crate.
ts-rs = { version = "12", features = ["serde-json-impl"], optional = true }

# `sqlx-sqlite` n'est nécessaire qu'aux tests (base sqlite en mémoire avec migrations réelles
# appliquées, cf. `db::test_support::real_db` — même pattern que les tests internes de
# miryad-core) : jamais utilisé en production (Postgres/CNPG uniquement, cf. AGENTS.md).
[features]
# B8 `app/src/sessions/events.sdd` — export ts-rs de @HostEvent (test `export_host_event_ts`,
# job CI `tsrs`). Motif identique à `lib/Cargo.toml` : feature homonyme traitée par `dep:`.
ts-rs = ["dep:ts-rs"]

[dev-dependencies]
# `test-util` : horloge pausable (`#[tokio::test(start_paused = true)]`) pour tester la borne
# de `wait_owner_ready` sans attendre 30 s réelles (api/projects.rs). Feature seule, aucune crate ajoutée.
tokio = { version = "1", features = ["full", "test-util"] }
sea-orm = { version = "2", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls", "macros", "mock"] }
sea-orm-migration = { version = "2", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls"] }
[lints]
workspace = true
